name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "from main import app; print(app.title)"
      - run: bash -n run.sh
      - name: Verify systemd unit
        run: |
          sudo useradd --system --home /opt/integration-ones --shell /usr/sbin/nologin integration-ones
          sudo mkdir -p /opt/integration-ones
          sudo cp run.sh /opt/integration-ones/run.sh
          sudo systemd-analyze verify deploy/integration-ones.service
